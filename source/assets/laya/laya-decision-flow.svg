<text x="54" y="246" class="note">方位示意，不是实际棋盘坐标</text>
<text x="340" y="115" class="">蛇头朝左，食物在蛇头左下方</text>
<text x="340" y="151" class="">程序读取蛇、食物的位置和可选方向</text>
<text x="340" y="195" class="note">深绿：蛇头    浅绿：蛇身    橙色：食物</text>
<path d="M450 262V291" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="295" width="840" height="240" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
<text x="54" y="332" class="heading">2  程序生成文字说明，交给 Laya</text>
<text x="54" y="366" class="note">游戏状态 + 选择规则 + 每个方向的报告（中文概括）</text>
<text x="54" y="406" class="">选项 / 方向</text>
<text x="300" y="406" class="">移动后到食物的距离</text>
<text x="600" y="406" class="">移动后可到达的空格</text>
<text x="54" y="444" class="">A  上</text>
<text x="355" y="444" class="">21 步</text>
<text x="655" y="444" class="">574 格</text>
<text x="54" y="477" class="">B  下</text>
<text x="355" y="477" class="">19 步</text>
<text x="655" y="477" class="">574 格</text>
<text x="54" y="510" class="">C  左</text>
<text x="355" y="510" class="">19 步</text>
<text x="655" y="510" class="">574 格</text>
<path d="M450 537V566" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="570" width="840" height="110" rx="12" fill="#faf5ff" stroke="#c4b5fd"/>
<text x="54" y="607" class="heading">3  Laya 评判选项</text>
<text x="54" y="644" class="">读取文字，返回所选选项和各选项的概率</text>
<path d="M450 682V711" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="715" width="840" height="110" rx="12" fill="#fff7ed" stroke="#fdba74"/>
<text x="54" y="752" class="heading">4  程序移动蛇</text>
<text x="54" y="789" class="">根据结果选择方向，移动一格；下一步再重复这个过程</text>
