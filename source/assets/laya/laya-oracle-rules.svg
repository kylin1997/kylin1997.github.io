<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
<title id="title">参考方向的常见计算过程</title>
<desc id="desc">参考程序 Oracle 读取完整游戏状态，逐个试算方向，比较食物路径和通向蛇尾的路径。在能到食物且通过回尾检查的方向中，选食物路径最短的。其他情况按教程图下规则表处理；参考方向不保证最优或长期安全。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033;font-size:19px}.title{font-size:27px;font-weight:600}.heading{font-size:23px;font-weight:600}.subheading{font-size:21px;font-weight:600}.note{font-size:17px;fill:#475569}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#64748b"/></marker></defs>
<rect width="900" height="690" fill="white"/>

<text x="30" y="42" class="title">参考方向的常见计算过程</text>
<text x="30" y="73" class="note">由参考程序（Oracle）计算；箭头表示计算顺序</text>
<g class="card"><rect x="30" y="94" width="840" height="106" rx="12" fill="#f0fdf4" stroke="#86efac"/></g>
<text x="54" y="131" class="heading">1  读取当前游戏状态</text>
<text x="54" y="167" class="">蛇与食物的位置 + 可选方向（已排除反向和立即碰撞）</text>
<path class="connector" d="M450 202V228" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="30" y="232" width="840" height="228" rx="12" fill="#eff6ff" stroke="#93c5fd"/></g>
<text x="54" y="270" class="heading">2  对每个方向，试算移动一格后的棋盘</text>
<text x="54" y="305" class="note">以下两项都基于试算结果，计算时不真正移动蛇</text>
<g class="card"><rect x="54" y="324" width="380" height="110" rx="12" fill="white" stroke="#bfdbfe"/></g>
<text x="74" y="358" class="subheading">离食物还要几步？</text>
<text x="74" y="389" class="note">从移动后的落点找最短路径</text>
<text x="74" y="417" class="note">记录步数；没有路就记为不可达</text>
<g class="card"><rect x="466" y="324" width="380" height="110" rx="12" fill="white" stroke="#bfdbfe"/></g>
<text x="486" y="358" class="subheading">还能走到蛇尾吗？</text>
<text x="486" y="389" class="note">在移动后的棋盘上找路</text>
<text x="486" y="417" class="note">检查蛇头与蛇尾是否连通</text>
<path class="connector" d="M450 462V489" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g class="card"><rect x="30" y="493" width="840" height="122" rx="12" fill="#faf5ff" stroke="#c4b5fd"/></g>
<text x="54" y="531" class="heading">3  选出参考方向</text>
<text x="54" y="567" class="">在能到食物、且能走到蛇尾的方向中，选食物路径最短的</text>
<text x="54" y="599" class="note">其他情况见正文「没有合适方向时怎么办」的规则表</text>
<text x="30" y="655" class="note">输出：本步参考方向（训练的参考答案）；不保证最优或长期安全</text>
</svg>